<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Crop Recommendation System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #BCBBB8;
        }
        .main-title {
            color: #085a16;
            text-align: center;
            font-weight: 700;
            margin-bottom: 20px;
        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        label {
            font-weight: bold;
            color: #333;
            margin-top: 10px;
        }
        .btn-recommend {
            background-color: #085a16;
            border: none;
            padding: 10px 30px;
            font-size: 1.2rem;
            transition: 0.3s;
        }
        .btn-recommend:hover {
            background-color: #118a26;
            transform: scale(1.05);
        }
        .result-card {
            margin: 20px auto;
            width: 20rem;
            border-radius: 15px;
            overflow: hidden;
        }
        footer {
            background-color: #085a16;
            color: white;
            padding: 1rem;
            text-align: center;
            margin-top: 50px;
        }
    </style>
  </head>

  <body>
    <nav class="navbar navbar-expand-lg navbar-dark" style="background-color: #085a16">
      <div class="container-fluid">
        <a class="navbar-brand" href="/">Crop Recommendation</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item"><a class="nav-link active" href="/">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="/about">About</a></li>
            <li class="nav-item"><a class="nav-link" href="/crop-info">Crop Information</a></li>
            <li class="nav-item"><a class="nav-link" href="/contact">Contact</a></li>
          </ul>
        </div>
      </div>
    </nav>

    <div class="container my-5">
      <h1 class="main-title">Crop Recommendation System 🌱</h1>

      <form action="/predict" method="POST">
          <div class="row">
              <div class="col-md-4">
                  <label>Nitrogen (N)</label>
                  <input type="number" name="Nitrogen" placeholder="Value for N" class="form-control" required>
              </div>
              <div class="col-md-4">
                  <label>Phosphorus (P)</label>
                  <input type="number" name="Phosporus" placeholder="Value for P" class="form-control" required>
              </div>
              <div class="col-md-4">
                  <label>Potassium (K)</label>
                  <input type="number" name="Potassium" placeholder="Value for K" class="form-control" required>
              </div>
          </div>

          <div class="row mt-3">
              <div class="col-md-4">
                  <label>Temperature (°C)</label>
                  <input type="number" step="0.01" name="Temperature" placeholder="e.g. 25.5" class="form-control" required>
              </div>
              <div class="col-md-4">
                  <label>Humidity (%)</label>
                  <input type="number" step="0.01" name="Humidity" placeholder="e.g. 70" class="form-control" required>
              </div>
              <div class="col-md-4">
                  <label>pH Value</label>
                  <input type="number" step="0.01" name="Ph" placeholder="0 to 14" class="form-control" required>
              </div>
          </div>

          <div class="row mt-3">
              <div class="col-md-4">
                  <label>Rainfall (mm)</label>
                  <input type="number" step="0.01" name="Rainfall" placeholder="e.g. 200" class="form-control" required>
              </div>
          </div>

          <div class="text-center mt-5">
              <button type="submit" class="btn btn-success btn-recommend">Get Recommendation</button>
          </div>
      </form>

      {% if result %}
      <div class="card result-card bg-dark text-white text-center">
          <div class="card-body">
              <h5 class="card-title text-success">Recommended Crop:</h5>
              <h2 class="card-text text-warning">{{ result }}</h2>
          </div>
      </div>
      {% endif %}
    </div>

    <footer>
        <p>&copy; 2024 Crop Recommendation System. All rights reserved.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
